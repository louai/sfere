[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfere"
version = "0.4.0"
description = "Tracks a glowing contact-juggling ball with a webcam and renders music-reactive visuals"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "opencv-python",
  "moderngl",
  "glfw",
  "imgui-bundle",
  "soundcard",
  "soundfile",
  "sounddevice",
  "python-osc",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sfere = "sfere.__main__:main"

[tool.setuptools.packages.find]
include = ["sfere*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
